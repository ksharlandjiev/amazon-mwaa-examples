#
# NOTE ON REGION: `region` below is a DEFAULT, not a recommendation. It must be a
# Region where MWAA Serverless is available and where your workflows live. Change it
# here or override per command with `sam deploy --region <your-region>`; otherwise a
# plain `sam deploy` silently targets us-east-1.
#
# NOTE ON PARAMETERS: WorkflowBucketName is REQUIRED and has no default. A plain
# `sam deploy` will fail until you set it, which is deliberate — it used to accept an
# empty value and fall back to granting S3 access across every bucket in the account,
# so the laziest deploy produced the widest permissions. Fill it in below, or pass
# `--parameter-overrides WorkflowBucketName=...` per command.

version = 0.1

[default.global.parameters]
region = "us-east-1"

[default.deploy.parameters]
stack_name = "mwaa-serverless-mcp"
resolve_s3 = true
s3_prefix = "mwaa-serverless-mcp"
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
image_repositories = []
# REQUIRED — replace the bucket name, then uncomment. The rest are optional; the
# defaults shown are the ones the template already applies.
# parameter_overrides = [
#   "WorkflowBucketName=my-mwaa-workflow-bucket",
#   "PassableExecutionRolePath=mwaa-serverless-*",
#   "AllowWorkflowDeletion=false",
#   "EnableFailureAnalysis=true",   # false = no bedrock:InvokeModel; see README data-flow note
# ]
