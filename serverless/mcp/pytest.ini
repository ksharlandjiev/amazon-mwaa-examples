;
; Run from serverless/mcp:
;     pip install -r src/requirements-local.txt pytest
;     python -m pytest
;
; No test in this suite calls AWS. Workflow operations are exercised against a stub
; client that records destructive calls so the tests can assert they did NOT happen.

[pytest]
testpaths = tests
addopts = -q --strict-markers
filterwarnings =
    error::DeprecationWarning:validator
    error::DeprecationWarning:builder
    error::DeprecationWarning:python_converter
